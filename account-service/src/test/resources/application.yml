spring:
  profiles:
    active: test
  application:
    name: ACCOUNT-SERVICE
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: test-only-secret-key-for-integration-tests-must-be-256-bits-long-enough

management:
  endpoints:
    web:
      exposure:
        include: health,info
