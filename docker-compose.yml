version: '3.8'

networks:
  erp-network:
    driver: bridge

services:

  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------

  postgres:
    image: postgres:15
    container_name: erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: erp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      # Note: the "ruok" four-letter-word command is disabled by default in
      # this image (only "srvr" is enabled), so use that instead.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Zookeeper || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: erp-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dual-listener setup: PLAINTEXT is host-facing (localhost:9092, for
      # tools/clients running directly on the host machine), while
      # PLAINTEXT_INTERNAL is what other containers on erp-network use to
      # reach Kafka by its service name (kafka:29092). A container resolving
      # "localhost" would otherwise reach itself, not the kafka container.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ---------------------------------------------------------------------
  # Observability - ELK stack
  # ---------------------------------------------------------------------

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: erp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - erp-network

  logstash:
    image: logstash:8.13.0
    container_name: erp-logstash
    ports:
      - "5000:5000/tcp"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - erp-network

  kibana:
    image: kibana:8.13.0
    container_name: erp-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - erp-network

  # ---------------------------------------------------------------------
  # Discovery + config
  # ---------------------------------------------------------------------

  eureka-server:
    image: erp-eureka-server:1.0
    container_name: erp-eureka-server
    networks:
      - erp-network
    restart: unless-stopped
    # Relies on the HEALTHCHECK baked into the image (Dockerfile) instead of
    # redeclaring one here; depends_on: condition: service_healthy still works
    # against it.

  config-server:
    image: erp-config-server:1.0
    container_name: erp-config-server
    environment:
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      # D:\erp-config lives outside this repo and is never baked into the
      # image; it is bind-mounted read-only below and pointed at here.
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS: file:///app/erp-config
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    volumes:
      - D:/erp-config:/app/erp-config:ro
    networks:
      - erp-network
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Business services
  # ---------------------------------------------------------------------

  user-service:
    image: erp-user-service:1.0
    container_name: erp-user-service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # NOTE on CONFIG_SERVER_URL: each service's bundled application.yml
      # declares "spring.config.import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
      # (a source change made during containerization) rather than a bare
      # "configserver:http://localhost:8888". This matters because fully
      # overriding spring.config.import itself via a container environment
      # variable (e.g. SPRING_CONFIG_IMPORT=configserver:http://config-server:8888)
      # was observed, during verification, to NOT reliably replace the
      # classpath-declared import — Spring Boot's Config Data API can end up
      # processing the environment-variable-sourced import and the
      # classpath-sourced import as two independent contributors, and in
      # practice the classpath one (still pointing at localhost:8888, which
      # doesn't exist in a container) kept winning, crashing the app with
      # "Connection refused". Parameterizing just the host/port inside the
      # single classpath-declared import avoids that entirely — there is only
      # ever one spring.config.import declaration to resolve.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb?TimeZone=UTC
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - erp-network
    restart: unless-stopped

  account-service:
    image: erp-account-service:1.0
    container_name: erp-account-service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # See user-service for why CONFIG_SERVER_URL (rather than overriding
      # SPRING_CONFIG_IMPORT wholesale) is the reliable way to redirect the
      # config-server host in a container.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accountdb?TimeZone=UTC
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - erp-network
    restart: unless-stopped

  budget-service:
    image: erp-budget-service:1.0
    container_name: erp-budget-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # See user-service for why CONFIG_SERVER_URL (rather than overriding
      # SPRING_CONFIG_IMPORT wholesale) is the reliable way to redirect the
      # config-server host in a container.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/budgetdb?TimeZone=UTC
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - erp-network
    restart: unless-stopped

  transaction-service:
    image: erp-transaction-service:1.0
    container_name: erp-transaction-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # See user-service for why CONFIG_SERVER_URL (rather than overriding
      # SPRING_CONFIG_IMPORT wholesale) is the reliable way to redirect the
      # config-server host in a container.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transactiondb?TimeZone=UTC
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - erp-network
    restart: unless-stopped

  notification-service:
    image: erp-notification-service:1.0
    container_name: erp-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # See user-service for why CONFIG_SERVER_URL (rather than overriding
      # SPRING_CONFIG_IMPORT wholesale) is the reliable way to redirect the
      # config-server host in a container.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificationdb?TimeZone=UTC
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - erp-network
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Edge / gateway
  # ---------------------------------------------------------------------

  api-gateway:
    image: erp-api-gateway:1.0
    container_name: erp-api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # See user-service for why CONFIG_SERVER_URL (rather than overriding
      # SPRING_CONFIG_IMPORT wholesale) is the reliable way to redirect the
      # config-server host in a container.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - erp-network
    restart: unless-stopped

volumes:
  postgres-data:
  elasticsearch-data:
