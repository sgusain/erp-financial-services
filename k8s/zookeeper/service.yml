apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: erp-financial-services
  labels:
    app: zookeeper
    version: v1
    component: infra
spec:
  type: ClusterIP
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
    - name: peer
      port: 2888
      targetPort: 2888
    - name: leader-election
      port: 3888
      targetPort: 3888
