apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: erp-financial-services
  labels:
    app: config-server
    version: v1
    component: discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
        version: v1
        component: discovery
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: config-server
          image: 160184161543.dkr.ecr.us-east-1.amazonaws.com/erp-config-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: http
          envFrom:
            - configMapRef:
                name: erp-config
            - secretRef:
                name: erp-secrets
          env:
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS
              value: "file:///app/erp-config"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: erp-config-files
              mountPath: /app/erp-config
              readOnly: true
      volumes:
        - name: erp-config-files
          configMap:
            name: erp-config-files
