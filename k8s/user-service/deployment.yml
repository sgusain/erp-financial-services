apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: erp-financial-services
  labels:
    app: user-service
    version: v1
    component: business
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        version: v1
        component: business
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: user-service
          image: 160184161543.dkr.ecr.us-east-1.amazonaws.com/erp-user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: erp-config
            - secretRef:
                name: erp-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/userdb?TimeZone=UTC"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
