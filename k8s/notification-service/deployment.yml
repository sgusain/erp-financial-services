apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: erp-financial-services
  labels:
    app: notification-service
    version: v1
    component: business
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
        component: business
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: notification-service
          image: 160184161543.dkr.ecr.us-east-1.amazonaws.com/erp-notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
              name: http
          envFrom:
            - configMapRef:
                name: erp-config
            - secretRef:
                name: erp-secrets
          # SPRING_KAFKA_BOOTSTRAP_SERVERS comes from the erp-config envFrom
          # above; this service has no database of its own.
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
