apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: erp-financial-services
  labels:
    app: eureka-server
    version: v1
    component: discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
        version: v1
        component: discovery
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: eureka-server
          image: 160184161543.dkr.ecr.us-east-1.amazonaws.com/erp-eureka-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
              name: http
          envFrom:
            - configMapRef:
                name: erp-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
