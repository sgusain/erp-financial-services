name: CI — Build and Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run tests
        # NOT -T 4: standard ubuntu-latest runners have 2 CPU cores. Building
        # 4 modules in parallel would mean up to 4 concurrent Testcontainers
        # Postgres/Kafka instances competing for that, which is a far more
        # likely cause of "Failed to load ApplicationContext" on CI than any
        # Config Server connectivity issue (tests already fully isolate from
        # Config Server via @DynamicPropertySource in each service's
        # AbstractIntegrationTest / support classes - verified passing
        # locally many times).
        run: mvn clean install

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'